[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trialmatch-assignment"
version = "0.1.0"
description = "Reproducible clinical-trial eligibility matching research prototype"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.0,<5",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
train = [
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "peft>=0.13",
    "torch>=2.5",
    "transformers>=4.49,<5",
]
app = ["streamlit>=1.40"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
